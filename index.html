function sendNotif(title,body){if(!('Notification' in window)||Notification.permission!=='granted')return;try{new Notification(title,{body,icon:'/color.png'})}catch{}}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createAssignments(names){const teams=shuffle(ALL_TEAMS);const n=names.length;const base=Math.floor(48/n);const extras=48%n;const result={};let idx=0;names.forEach((name,i)=>{const count=i<extras?base+1:base;result[name]=teams.slice(idx,idx+count);idx+=count});return result}
function buildSequence(names,assignments){const steps=[];let t=400;names.forEach(name=>{steps.push({at:t,type:"participant",name});t+=3000;(assignments[name]||[]).forEach(team=>{steps.push({at:t,type:"team",name,team});t+=820});t+=1900});steps.push({at:t,type:"done"});return steps}
function loadSaved(key){try{const d=localStorage.getItem(key);return d?JSON.parse(d):null}catch{return null}}
function loadStr(key){try{return localStorage.getItem(key)||""}catch{return""}}
function calcStandings(group,scores){
  const pts={};const stats={};
  group.teams.forEach(t=>{pts[t.name]=0;stats[t.name]={p:0,w:0,d:0,l:0,gf:0,ga:0}});
  group.matches.forEach(m=>{const key=`${m.t1}_${m.t2}`;const s=scores[key];if(s&&s.s1!==""&&s.s2!==""){const s1=parseInt(s.s1,10),s2=parseInt(s.s2,10);stats[m.t1].p++;stats[m.t2].p++;stats[m.t1].gf+=s1;stats[m.t1].ga+=s2;stats[m.t2].gf+=s2;stats[m.t2].ga+=s1;if(s1>s2){stats[m.t1].w++;pts[m.t1]=(pts[m.t1]||0)+3;stats[m.t2].l++}else if(s1<s2){stats[m.t2].w++;pts[m.t2]=(pts[m.t2]||0)+3;stats[m.t1].l++}else{stats[m.t1].d++;stats[m.t2].d++;pts[m.t1]=(pts[m.t1]||0)+1;pts[m.t2]=(pts[m.t2]||0)+1}}});
  return group.teams.map(t=>({...t,...stats[t.name],gd:stats[t.name].gf-stats[t.name].ga,pts:pts[t.name]||0})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function getAdvancing(sc){const w=[],r=[];GROUPS.forEach(g=>{const s=calcStandings(g,sc);if(s[0]?.p>0){w.push(s[0]);r.push(s[1])}});const thirds=GROUPS.map(g=>calcStandings(g,sc)[2]).filter(t=>t?.p>0).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8);return[...w,...r,...thirds]}

function rndKOScore(){const r=Math.random();const g=Math.floor(Math.random()*3)+1;const l=Math.floor(Math.random()*g);return r<0.5?{s1:String(g),s2:String(l)}:{s1:String(l),s2:String(g)}}

function generateFullKnockout(scores,ownerMap){
  const adv=getAdvancing(scores);if(adv.length<16)return null;
  const em=(id)=>({id,t1:"",f1:"",o1:"",t2:"",f2:"",o2:"",s1:"",s2:"",w:""});
  const ko={r32:Array.from({length:16},(_,i)=>em(i)),r16:Array.from({length:8},(_,i)=>em(i)),qf:Array.from({length:4},(_,i)=>em(i)),sf:Array.from({length:2},(_,i)=>em(i)),final:em(0),third:em(0),champion:""};
  // Populate R32 — pair sequentially: winners first, then runners-up
  const pool=[...adv].slice(0,32);
  pool.forEach((t,i)=>{const mi=Math.floor(i/2);const p=i%2===0?"t1":"t2";ko.r32[mi][p]=t.name||t.n;ko.r32[mi][p==="t1"?"f1":"f2"]=t.flag||t.f||"";ko.r32[mi][p==="t1"?"o1":"o2"]=ownerMap[t.name||t.n]||""});
  // Simulate R32 through SF
  const rounds=["r32","r16","qf","sf"];
  rounds.forEach(rnd=>{
    ko[rnd].forEach((m,idx)=>{
      if(!m.t1||!m.t2)return;
      const sc=rndKOScore();
      const win=parseInt(sc.s1)>=parseInt(sc.s2)?{n:m.t1,f:m.f1,o:m.o1}:{n:m.t2,f:m.f2,o:m.o2};
      const lose=parseInt(sc.s1)>=parseInt(sc.s2)?{n:m.t2,f:m.f2,o:m.o2}:{n:m.t1,f:m.f1,o:m.o1};
      ko[rnd][idx]={...m,...sc,w:win.n};
      const set=(target,p,x)=>{target[p]=x.n;target[p==="t1"?"f1":"f2"]=x.f;target[p==="t1"?"o1":"o2"]=x.o};
      if(rnd==="r32"){const ni=Math.floor(idx/2);set(ko.r16[ni],idx%2===0?"t1":"t2",win)}
      else if(rnd==="r16"){const ni=Math.floor(idx/2);set(ko.qf[ni],idx%2===0?"t1":"t2",win)}
      else if(rnd==="qf"){const ni=Math.floor(idx/2);set(ko.sf[ni],idx%2===0?"t1":"t2",win)}
      else if(rnd==="sf"){set(ko.final,idx===0?"t1":"t2",win);set(ko.third,idx===0?"t1":"t2",lose)}
    });
  });
  // Final
  if(ko.final.t1&&ko.final.t2){const sc=rndKOScore();const win=parseInt(sc.s1)>=parseInt(sc.s2)?ko.final.t1:ko.final.t2;ko.final={...ko.final,...sc,w:win};ko.champion=win}
  if(ko.third.t1&&ko.third.t2){const sc=rndKOScore();const win=parseInt(sc.s1)>=parseInt(sc.s2)?ko.third.t1:ko.third.t2;ko.third={...ko.third,...sc,w:win}}
  return ko
}


function propKO(ko,rnd,idx,wn,wf,wo,ln,lf,lo){const k=JSON.parse(JSON.stringify(ko));const set=(r,i,p,n,f,o)=>{if(r==="final"||r==="third"){k[r][p]=n;k[r][p==="t1"?"f1":"f2"]=f;k[r][p==="t1"?"o1":"o2"]=o}else{k[r][i][p]=n;k[r][i][p==="t1"?"f1":"f2"]=f;k[r][i][p==="t1"?"o1":"o2"]=o}};const nx={r32:{r:"r16",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},r16:{r:"qf",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},qf:{r:"sf",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},sf:{r:"final",i:0,p:idx===0?"t1":"t2"}};const n=nx[rnd];if(n)set(n.r,n.i,n.p,wn,wf,wo);if(rnd==="sf"){const lp=idx===0?"t1":"t2";set("third",0,lp,ln,lf,lo)}return k}

function detectEliminations(scores,ownerMap,knownLosses){
  const knownOut=new Set(knownLosses.map(l=>l.loser));
  const newElim=[];const base=Date.now();
  GROUPS.forEach(g=>{
    const st=calcStandings(g,scores);
    const last=st[3];
    if(!last||last.p!==3)return;
    if(!knownOut.has(last.name)){
      newElim.push({loser:last.name,loserFlag:last.flag||"",owner:ownerMap[last.name]||"",matchDesc:`Finished 4th in Group ${g.id} — eliminated`,ts:base+newElim.length*7});
      knownOut.add(last.name);
    }
  });
  return newElim;
}

function detectMatchLosses(scores,ownerMap,knownLosses){
  const teamFlags={};GROUPS.forEach(g=>g.teams.forEach(t=>{teamFlags[t.name]=t.flag}));
  const knownKeys=new Set(knownLosses.filter(l=>l.matchKey).map(l=>l.matchKey));
  const newLosses=[];const base=Date.now();
  GROUPS.forEach(g=>{
    g.matches.forEach(m=>{
      const key=`${m.t1}_${m.t2}`;
      const s=scores[key];
      if(!s||s.s1===undefined||s.s1===""||s.s2===undefined||s.s2==="")return;
      const s1=parseInt(s.s1),s2=parseInt(s.s2);
      if(isNaN(s1)||isNaN(s2)||s1===s2)return;
      const loser=s1<s2?m.t1:m.t2,winner=s1<s2?m.t2:m.t1;
      const lg=Math.min(s1,s2),wg=Math.max(s1,s2);
      const matchKey=`grp_${key}`;
      if(knownKeys.has(matchKey))return;
      newLosses.push({loser,loserFlag:teamFlags[loser]||"",owner:ownerMap[loser]||"",matchDesc:`${loser} ${lg} Vs ${wg} ${winner}`,matchKey,ts:base+newLosses.length*7});
    });
  });
  return newLosses;
}

function getUpcomingMatches(userTeams,scores,limit=5){
  const names=new Set((userTeams||[]).map(t=>t.name));
  const today=new Date();today.setHours(0,0,0,0);
  const upcoming=[];
  for(const g of GROUPS){for(const m of g.matches){
    if(!names.has(m.t1)&&!names.has(m.t2))continue;
    const key=`${m.t1}_${m.t2}`;
    if(scores[key]?.s1!==undefined&&scores[key]?.s1!=="")continue;
    if(!m.utc)continue;
    const md=new Date(m.utc);
    if(md>=today)upcoming.push({...m,groupId:g.id,matchDate:md});
  }}
  return upcoming.sort((a,b)=>a.matchDate-b.matchDate).slice(0,limit);
}
function getNextDayAllMatches(scores){
  const today=new Date();today.setHours(0,0,0,0);
  const all=[];
  for(const g of GROUPS){for(const m of g.matches){
    const key=`${m.t1}_${m.t2}`;
    if(scores[key]?.s1!==undefined&&scores[key]?.s1!=="")continue;
    if(!m.utc)continue;
    const md=new Date(m.utc);
    if(md>=today)all.push({...m,groupId:g.id,matchDate:md});
  }}
  all.sort((a,b)=>a.matchDate-b.matchDate);
  if(!all.length)return[];
  const nextDate=all[0].matchDate.toLocaleDateString();
  return all.filter(m=>m.matchDate.toLocaleDateString()===nextDate);
}
function getTeamStanding(teamName,scores){
  for(const g of GROUPS){
    if(!g.teams.find(t=>t.name===teamName))continue;
    const st=calcStandings(g,scores);
    const pos=st.findIndex(t=>t.name===teamName);
    if(pos<0)continue;
    return{group:g.id,pos:pos+1,...st[pos]};
  }
  return null;
}

    if(!drawNames.length)return;

    buildSequence(drawNames,drawAssignments).forEach(step=>{
      const t=setTimeout(()=>{
        if(step.type==="participant"){setCurParticipant(step.name);setRevealedTeams([]);setParticipantZoom(step.name);const zt=setTimeout(()=>setParticipantZoom(null),2700);timersRef.current.push(zt);}

  const startDraw=useCallback(()=>{
    if(countdownRef.current){clearInterval(countdownRef.current);countdownRef.current=null;}
    clearTimers();const names=[...participants];const assignments=createAssignments(names);const sequence=buildSequence(names,assignments);
    const dst=Date.now();drawStartTimeRef.current=dst;drawWatchedRef.current=true;
    setDrawNames(names);setDrawAssignments(assignments);setCurParticipant(null);setRevealedTeams([]);setParticipantZoom(null);setScreen("drawing");
    pushCloud({drawMode:"drawing",drawStartTime:dst,drawDate,drawData:{names,assignments},scores,koData,photos:teamPhotos,losses});
    sendWebPush("🎰 The draw has started!","Open the app now to watch the World Cup 2026 sweepstake draw live");
    const DRAW_DELAY=60000;
    let r=60;setDrawCountdown(r);
    countdownRef.current=setInterval(()=>{r--;if(r<=0){clearInterval(countdownRef.current);countdownRef.current=null;setDrawCountdown(null);}else{setDrawCountdown(r);}},1000);
    sequence.forEach(step=>{const t=setTimeout(()=>{
      if(step.type==="participant"){setCurParticipant(step.name);setRevealedTeams([]);setParticipantZoom(step.name);const zt=setTimeout(()=>setParticipantZoom(null),2700);timersRef.current.push(zt);}
      else if(step.type==="team"){setRevealedTeams(prev=>[...prev,step.team])}
      else{try{localStorage.setItem("wc26_draw_data",JSON.stringify({names,assignments}))}catch{}try{localStorage.removeItem("wc26_user")}catch{}setCurrentUser("");setScreen("results");pushCloud({drawMode:"done",drawDate,drawData:{names,assignments},scores,koData,photos:teamPhotos,losses});}
    },step.at+DRAW_DELAY);timersRef.current.push(t)});
  },[participants]);

  const reset=()=>{

    clearTimers();try{localStorage.removeItem("wc26_draw_data")}catch{};try{localStorage.removeItem("wc26_scores")}catch{};try{localStorage.removeItem("wc26_ko")}catch{}
    setScreen("setup");setParticipants([]);setInputVal("");setDrawNames([]);setDrawAssignments({});setCurParticipant(null);setRevealedTeams([]);setParticipantZoom(null);setResultsTab("home");setDemoStage(0);setKoData(null);setScores({});setLosses([]);setCurrentUser("");drawStartTimeRef.current=null;drawWatchedRef.current=false;
    try{localStorage.removeItem("wc26_losses")}catch{};try{localStorage.removeItem("wc26_user")}catch{};
    pushCloud({drawDate,drawData:null,scores:{},koData:null,losses:[],photos:teamPhotos});

  const addParticipant=()=>{const t=inputVal.trim();if(t&&participants.length<24&&!participants.includes(t)){setParticipants(p=>[...p,t]);setInputVal("")}};
  const removeParticipant=name=>setParticipants(p=>p.filter(x=>x!==name));
  const copyResults=()=>{const text="World Cup 2026 Sweepstake Results\n\n"+drawNames.map(n=>`${n}: ${(drawAssignments[n]||[]).map(t=>`${t.flag} ${t.name}`).join(", ")}`).join("\n");navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500)})};

  const startDemo=()=>{

    const assignments=createAssignments(names);
    try{localStorage.setItem("wc26_draw_data",JSON.stringify({names,assignments}))}catch{}
    try{localStorage.removeItem("wc26_scores")}catch{}
    try{localStorage.removeItem("wc26_ko")}catch{}
    try{localStorage.removeItem("wc26_losses")}catch{}
    setDrawNames(names);setDrawAssignments(assignments);setScores({});setKoData(null);setLosses([]);setIcingAlerts([]);
    setDemoStage(1);setScreen("results");setResultsTab("home");
    setCurrentUser("Jack");try{localStorage.setItem("wc26_user","Jack")}catch{};
  };

  const advanceDemo=()=>{
    if(demoStage===1){
      // Stage 2: fill all group scores
      const s=generateDemoScores();
      try{localStorage.setItem("wc26_scores",JSON.stringify(s))}catch{}
      setScores(s);setDemoStage(2);setResultsTab("groups");
    } else if(demoStage===2){
      // Stage 3: animate knockout bracket round by round
      const om={};Object.entries(drawAssignments).forEach(([p,ts])=>{ts.forEach(t=>{om[t.name]=p})});
      const fullKo=generateFullKnockout(scores,om);
      if(!fullKo){setDemoStage(4);return}
      demoKoRef.current=fullKo;
      setResultsTab("top16");setDemoStage(3);

      // Extract every loser from the generated KO and populate losses + icing
      const RDLABELS={r32:"Round of 32",r16:"Round of 16",qf:"Quarter Final",sf:"Semi Final",final:"Final",third:"3rd Place"};
      const newLosses=[];const base=Date.now();
      Object.entries(RDLABELS).forEach(([rnd,label])=>{
        const ms=Array.isArray(fullKo[rnd])?fullKo[rnd]:[fullKo[rnd]];
        ms.forEach(m=>{
          if(!m||!m.w||!m.t1||!m.t2)return;
          const ln=m.w===m.t1?m.t2:m.t1,lf=m.w===m.t1?m.f2:m.f1,lo=m.w===m.t1?m.o2:m.o1,wn=m.w===m.t1?m.t1:m.t2;
          newLosses.push({loser:ln,loserFlag:lf||"",owner:lo||"",matchDesc:`Knocked out in the ${label} by ${wn} (${m.s1}-${m.s2})`,ts:base+newLosses.length*7});
        });
      });
      setLosses(prev=>{const nl=[...prev,...newLosses];try{localStorage.setItem("wc26_losses",JSON.stringify(nl))}catch{};return nl});
      // Trigger icing popups for Jack's eliminated teams
      const jackNames=new Set((drawAssignments["Jack"]||[]).map(t=>t.name));
      const jackLosses=newLosses.filter(l=>jackNames.has(l.loser)&&!icingSeenRef.current.has(l.ts));
      if(jackLosses.length>0){jackLosses.forEach(l=>icingSeenRef.current.add(l.ts));setIcingAlerts(prev=>[...prev,...jackLosses])}

      // Reveal rounds progressively
      const blank={...EKO,r32:fullKo.r32};
      setKoData(blank);
      setTimeout(()=>setKoData(k=>({...k,r16:fullKo.r16})),1800);
      setTimeout(()=>setKoData(k=>({...k,qf:fullKo.qf})),3600);
      setTimeout(()=>setKoData(k=>({...k,sf:fullKo.sf})),5400);
      setTimeout(()=>{
        const complete={...fullKo};
        setKoData(complete);
        try{localStorage.setItem("wc26_ko",JSON.stringify(complete))}catch{}
        setDemoStage(4);
      },7200);
    }
  };

  const teamOwnerMap=useMemo(()=>{const map={};Object.entries(drawAssignments).forEach(([p,teams])=>{(teams||[]).forEach(t=>{map[t.name]=p})});return map},[drawAssignments]);

  const saveKo=(data)=>{setKoData(data);try{localStorage.setItem("wc26_ko",data?JSON.stringify(data):null)}catch{}};
  const handleScore=(key,val)=>{setScores(p=>{
    // group stage score changes don't trigger icing
    const n={...p,[key]:val};try{localStorage.setItem("wc26_scores",JSON.stringify(n))}catch{};return n;
  })};
  const triggerIcing=(alert)=>{const nl=[...losses,alert];setLosses(nl);try{localStorage.setItem("wc26_losses",JSON.stringify(nl))}catch{};if(!icingSeenRef.current.has(alert.ts)){icingSeenRef.current.add(alert.ts);setIcingAlerts(prev=>[...prev,alert])}};
  const handlePhotoUpload=(name,file)=>{if(!file)return;resizeImage(file).then(dataUrl=>{const p={...teamPhotos,[name]:dataUrl};setTeamPhotos(p);try{localStorage.setItem("wc26_photos",JSON.stringify(p))}catch{};pushCloud({drawDate,drawData:drawNames.length?{names:drawNames,assignments:drawAssignments}:null,scores,koData,photos:p,losses})});};


  const BIN_URL="https://api.jsonbin.io/v3/b";

  const pushCloud=async(patch)=>{
    const binId=CLOUD_BIN||(cloudCfg.binId||"");
    const key=CLOUD_KEY||(cloudCfg.key||"");
    if(!binId||!key)return;
    try{
      const full={pushSubs:pushSubsRef.current,...patch};
      const str=JSON.stringify(full);
      lastPushed.current=str;
      await fetch(`${BIN_URL}/${binId}`,{
        method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":key,"X-Bin-Versioning":"false"},
        body:str
      });
    }catch(e){console.warn("Cloud push failed",e)}
  };
  const sendWebPush=async(title,body)=>{
    let subs=pushSubsRef.current;
    if(!subs.length){
      const current=await pullCloud().catch(()=>null);
      if(current?.pushSubs?.length){setPushSubs(current.pushSubs);subs=current.pushSubs;}
    }
    if(!subs.length)return;
    try{
      const r=await fetch("/.netlify/functions/push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscriptions:subs,title,body})});
      const d=await r.json().catch(()=>({}));
      console.log("Web push result:",d);
    }catch(e){console.warn("sendWebPush failed",e);}
  };

  const pullCloud=async()=>{
    const binId=CLOUD_BIN||(cloudCfg.binId||"");
    const key=CLOUD_KEY||(cloudCfg.key||"");
    if(!binId||!key)return null;
    try{
      const r=await fetch(`${BIN_URL}/${binId}/latest`,{headers:{"X-Master-Key":key}});
      if(!r.ok)return null;
      const d=await r.json();return d.record||null;
    }catch{return null}
  };

  const applyCloudState=(data)=>{
    if(!data)return;
    // If this is data we just pushed ourselves, ignore it completely
    const incoming=JSON.stringify(data);
    if(incoming===lastPushed.current)return;
    // Only apply individual fields if they differ from current state
    if(data.drawDate&&data.drawDate!==drawDate){setDrawDate(data.drawDate);try{localStorage.setItem("wc26_draw_date",data.drawDate)}catch{}}
    if(data.photos){const p=data.photos;setTeamPhotos(p);try{localStorage.setItem("wc26_photos",JSON.stringify(p))}catch{}}
    if(data.pushSubs&&Array.isArray(data.pushSubs)){setPushSubs(data.pushSubs);}
    if(data.losses&&JSON.stringify(data.losses)!==JSON.stringify(losses)){const nl=data.losses;setLosses(nl);try{localStorage.setItem("wc26_losses",JSON.stringify(nl))}catch{};if(currentUser){const myNew=nl.filter(l=>l.owner===currentUser&&l.ts&&!icingSeenRef.current.has(l.ts));if(myNew.length>0){myNew.forEach(l=>icingSeenRef.current.add(l.ts));setIcingAlerts(prev=>{const existing=new Set(prev.map(a=>a.ts));return[...prev,...myNew.filter(a=>!existing.has(a.ts))]});myNew.forEach(l=>sendNotif(`💀 ${l.loser} just lost!`,l.matchDesc));}}}
    if(data.drawMode==="drawing"&&data.drawStartTime&&data.drawData&&!drawWatchedRef.current&&screen!=="drawing"){
      if(!sessionStorage.getItem("wc26_draw_reload")){sessionStorage.setItem("wc26_draw_reload","1");window.location.reload();return;}
      sessionStorage.removeItem("wc26_draw_reload");
      drawWatchedRef.current=true;
      if(countdownRef.current){clearInterval(countdownRef.current);countdownRef.current=null;}
      const{names,assignments}=data.drawData;
      sendNotif("🎰 The draw has started!","Open the app to watch the World Cup 2026 sweepstake draw live");
      clearTimers();setDrawNames(names);setDrawAssignments(assignments);setCurParticipant(null);setRevealedTeams([]);setParticipantZoom(null);setScreen("drawing");
      const DRAW_DELAY=60000;
      const elapsed=Date.now()-data.drawStartTime;
      const cdRemaining=Math.max(0,Math.ceil((DRAW_DELAY-elapsed)/1000));
      if(cdRemaining>0){let r=cdRemaining;setDrawCountdown(r);countdownRef.current=setInterval(()=>{r--;if(r<=0){clearInterval(countdownRef.current);countdownRef.current=null;setDrawCountdown(null);}else{setDrawCountdown(r);}},1000);}
      else{setDrawCountdown(null);}
      buildSequence(names,assignments).forEach(step=>{
        const delay=Math.max(0,step.at+DRAW_DELAY-elapsed);
        const t=setTimeout(()=>{
          if(step.type==="participant"){setCurParticipant(step.name);setRevealedTeams([]);setParticipantZoom(step.name);const zt=setTimeout(()=>setParticipantZoom(null),2700);timersRef.current.push(zt);}
          else if(step.type==="team"){setRevealedTeams(prev=>[...prev,step.team])}
          else{try{localStorage.setItem("wc26_draw_data",JSON.stringify({names,assignments}))}catch{}try{localStorage.removeItem("wc26_user")}catch{}setCurrentUser("");setScreen("results");}
        },delay);timersRef.current.push(t);
      });
      return;
    }
    if("drawData" in data){
      if(!data.drawData){
        // Draw was reset by organiser — apply to all devices
        clearTimers();
        try{localStorage.removeItem("wc26_draw_data")}catch{};
        try{localStorage.removeItem("wc26_scores")}catch{};
        try{localStorage.removeItem("wc26_ko")}catch{};
        try{localStorage.removeItem("wc26_user")}catch{};
        setDrawNames([]);setDrawAssignments({});setScores({});setKoData(null);
        setCurParticipant(null);setRevealedTeams([]);setParticipantZoom(null);
        setCurrentUser("");drawWatchedRef.current=false;
        setScreen("setup");
      } else {
        const cloudDraw=JSON.stringify(data.drawData);
        const currentDraw=JSON.stringify({names:drawNames,assignments:drawAssignments});
        if(cloudDraw!==currentDraw){
          try{localStorage.setItem("wc26_draw_data",cloudDraw)}catch{};
          setDrawNames(data.drawData.names||[]);
          setDrawAssignments(data.drawData.assignments||{});
          if(screen!=="drawing"&&screen!=="results"){try{localStorage.removeItem("wc26_user")}catch{}setCurrentUser("");setScreen("results");}
        }
      }
    }
    if(data.scores){
      const cloudScores=JSON.stringify(data.scores);
      const currentScores=JSON.stringify(scores);
      if(cloudScores!==currentScores){
        try{localStorage.setItem("wc26_scores",cloudScores)}catch{};
        setScores(data.scores);
      }
    }
    if(data.koData!==undefined){
      const cloudKo=JSON.stringify(data.koData||null);
      const currentKo=JSON.stringify(koData||null);
      if(cloudKo!==currentKo){
        try{localStorage.setItem("wc26_ko",cloudKo)}catch{};
        setKoData(data.koData||null);
      }
    }
    if(data.icingAlert&&data.icingAlert.ts&&!icingSeenRef.current.has(data.icingAlert.ts)){
      icingSeenRef.current.add(data.icingAlert.ts);
      if(!currentUser||currentUser===data.icingAlert.owner||isAdmin){
        setIcingAlerts(prev=>{const existing=new Set(prev.map(a=>a.ts));return existing.has(data.icingAlert.ts)?prev:[...prev,data.icingAlert]});
      }
    }
  };

  const syncNow=async()=>{
    setCloudStatus("syncing");

  // Pull from cloud once on page load — credentials are baked in so works for everyone
  useEffect(()=>{

  },[]);

  const sweepstakeStandings=useMemo(()=>{
    if(!drawNames.length)return[];
    const teamPts={};GROUPS.forEach(g=>{calcStandings(g,scores).forEach(t=>{teamPts[t.name]=t.pts})});

    }).sort((a,b)=>b.totalPts-a.totalPts);

  },[scores]);

  useEffect(()=>{applyCloudStateRef.current=applyCloudState});
  useEffect(()=>{const id=setInterval(async()=>{const d=await pullCloud();if(d&&applyCloudStateRef.current)applyCloudStateRef.current(d)},20000);return()=>clearInterval(id)},[]);
  useEffect(()=>{
    const init=async()=>{
      // Always request permission first (needed for local notifications too)
      if('Notification' in window&&Notification.permission==='default'){
        await Notification.requestPermission().catch(()=>{});
      }
      if(!('serviceWorker' in navigator)||!('PushManager' in window)||!VAPID_PUBLIC_KEY)return;
      try{
        await navigator.serviceWorker.register('/sw.js');
        if(Notification.permission!=='granted')return;
        const reg=await navigator.serviceWorker.ready;
        let sub=await reg.pushManager.getSubscription();
        if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});}
        const subJson=sub.toJSON();
        const current=await pullCloud();
        const existing=current?.pushSubs||[];
        // Always load cloud subs into ref so sendWebPush works immediately
        setPushSubs(existing);
        if(existing.some(s=>s.endpoint===subJson.endpoint))return;
        const merged=[...existing,subJson];
        setPushSubs(merged);
        await pushCloud({...(current||{}),pushSubs:merged});
      }catch(e){console.warn("Push setup failed",e);}
    };
    init();
  },[]);
  useEffect(()=>{const upd=()=>setIsPortrait(window.innerHeight>window.innerWidth);window.addEventListener("resize",upd);window.addEventListener("orientationchange",upd);return()=>{window.removeEventListener("resize",upd);window.removeEventListener("orientationchange",upd)}},[]);
  useEffect(()=>{if(screen==="drawing"&&!isPortrait){try{window.screen.orientation.lock("landscape").catch(()=>{})}catch{}; if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})} },[screen,isPortrait]);

        style={{position:"absolute",top:"max(16px,env(safe-area-inset-top,0px))",right:"16px",background:isAdmin?"rgba(125,219,80,.12)":"rgba(255,255,255,.06)",border:`1px solid ${isAdmin?"rgba(125,219,80,.3)":"rgba(255,255,255,.15)"}`,borderRadius:"8px",padding:"7px 14px",color:isAdmin?"#7ddb50":"rgba(255,255,255,.5)",fontSize:".8rem",cursor:"pointer",letterSpacing:"1px"}}>
        {isAdmin?"🔓 Organiser":"🔒 Organiser Login"}
      </button>

      {showLogin&&!isAdmin&&(

          />

        </div>

        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(.9rem,3.5vw,1.7rem)",letterSpacing:"8px",opacity:.75,marginTop:"4px"}}>Official Sweepstake Draw</div>

      {isAdmin?(
        <>

            <div style={{fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",color:GOLD,opacity:.8,marginBottom:"8px"}}>Set Draw Date and Time</div>
            <input type="datetime-local" value={drawDate}
              onChange={e=>{const v=e.target.value;setDrawDate(v);try{localStorage.setItem("wc26_draw_date",v)}catch{};pushCloud({drawDate:v,drawData:drawNames.length?{names:drawNames,assignments:drawAssignments}:null,scores,koData})}}
              style={{width:"100%",background:"rgba(255,255,255,.07)",border:"1px solid rgba(240,192,64,.25)",borderRadius:"6px",padding:"9px 12px",color:"#fff",fontSize:".95rem",fontFamily:"inherit"}}/>

                </div>

                </div>

                      const ordinal=n=>n===1?"st":n===2?"nd":n===3?"rd":"th";
                      return(
                        <div key={team.name} className="pop-in" style={{background:isOut?"rgba(255,55,55,.06)":advancing?"rgba(76,175,80,.07)":"rgba(255,255,255,.03)",border:`1px solid ${isOut?"rgba(255,55,55,.2)":advancing?"rgba(76,175,80,.18)":"rgba(255,255,255,.07)"}`,borderRadius:"14px",padding:"13px 9px",textAlign:"center",position:"relative"}}>
                          {isOut&&<div style={{position:"absolute",top:"6px",right:"6px",background:"rgba(255,55,55,.22)",borderRadius:"3px",padding:"1px 5px",fontSize:".55rem",color:"#ff6060",letterSpacing:"1px",fontFamily:"'Bebas Neue',sans-serif"}}>OUT</div>}
                          {advancing&&!isOut&&<div style={{position:"absolute",top:"6px",right:"6px",background:"rgba(76,175,80,.22)",borderRadius:"3px",padding:"1px 5px",fontSize:".55rem",color:"#7ddb50",letterSpacing:"1px",fontFamily:"'Bebas Neue',sans-serif"}}>TOP</div>}
                          <div style={{fontSize:"2.3rem",marginBottom:"5px",filter:isOut?"grayscale(.7) opacity(.55)":"none"}}>{team.flag}</div>
                          <div style={{fontSize:".7rem",color:isOut?"rgba(255,255,255,.3)":"rgba(255,255,255,.85)",fontWeight:600,marginBottom:"3px",lineHeight:1.2}}>{team.name}</div>
                          {st&&<div style={{fontSize:".58rem",color:"rgba(255,255,255,.32)",marginBottom:"3px"}}>Grp {st.group} · {st.pos}{ordinal(st.pos)}</div>}
                          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.25rem",color:isOut?"rgba(255,255,255,.18)":GOLD,lineHeight:1}}>{st?.pts||0}<span style={{fontSize:".5rem",opacity:.7}}> pts</span></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

          ):(
            /* ---- GROUP / ADMIN DASHBOARD ---- */
            <div>
              <div style={{textAlign:"center",marginBottom:"22px",paddingTop:"4px"}}>
                <div style={{fontSize:"2.8rem",marginBottom:"4px"}}>🏆</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(1.8rem,6vw,2.8rem)",color:GOLD,letterSpacing:"4px"}}>WC 2026 Sweepstake</div>
                <div style={{color:"rgba(255,255,255,.38)",fontSize:".82rem",marginTop:"3px"}}>{drawNames.length} players · £{drawNames.length*20} prize pool</div>
              </div>

              <div style={{display:"flex",gap:"10px",justifyContent:"center",marginBottom:"20px",flexWrap:"wrap"}}>
                <div style={{background:"linear-gradient(135deg,rgba(240,192,64,.12),rgba(240,192,64,.05))",border:"1px solid rgba(240,192,64,.22)",borderRadius:"12px",padding:"13px 18px",textAlign:"center",minWidth:"120px"}}>
                  <div style={{fontSize:"1.2rem",marginBottom:"2px"}}>🥇</div>
                  <div style={{fontSize:".58rem",letterSpacing:"2px",color:"rgba(255,255,255,.38)",textTransform:"uppercase",marginBottom:"2px"}}>1st Place</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:GOLD,lineHeight:1}}>£{drawNames.length*20-20}</div>
                </div>
                <div style={{background:"rgba(176,196,222,.06)",border:"1px solid rgba(176,196,222,.16)",borderRadius:"12px",padding:"13px 18px",textAlign:"center",minWidth:"120px"}}>
                  <div style={{fontSize:"1.2rem",marginBottom:"2px"}}>🥈</div>
                  <div style={{fontSize:".58rem",letterSpacing:"2px",color:"rgba(255,255,255,.38)",textTransform:"uppercase",marginBottom:"2px"}}>2nd Place</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:"#b0c4de",lineHeight:1}}>£20</div>
                </div>
              </div>

              {todayMs.length>0&&(
                <div style={{background:"rgba(240,192,64,.05)",border:"1px solid rgba(240,192,64,.18)",borderRadius:"14px",padding:"14px 16px",marginBottom:"18px"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".95rem",color:GOLD,letterSpacing:"3px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:GOLD,animation:"liveDot 1.2s ease-in-out infinite",flexShrink:0}}/>
                    Today's Matches
                  </div>
                  {todayMs.map((m,i)=>{const sk=`${m.t1}_${m.t2}`;const s=scores[sk];const hs=s&&s.s1!==undefined&&s.s1!=="";const o1=teamOwnerMap[m.t1],o2=teamOwnerMap[m.t2];return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:i>0?"9px 0 0":"0",borderTop:i>0?"1px solid rgba(240,192,64,.09)":"none",flexWrap:"wrap"}}>
                      <div style={{flex:1,display:"flex",alignItems:"center",gap:"7px",justifyContent:"flex-end",minWidth:"90px"}}>
                        {o1&&teamPhotos[o1]&&<div style={{width:"24px",height:"24px",borderRadius:"50%",overflow:"hidden",flexShrink:0}}><img src={teamPhotos[o1]} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>}
                        <div style={{textAlign:"right"}}>
                          {o1&&<div style={{fontSize:".58rem",color:GOLD,marginBottom:"1px"}}>{o1}</div>}
                          <div style={{fontSize:".8rem",color:"rgba(255,255,255,.82)"}}>{m.t1f} {m.t1}</div>
                        </div>
                      </div>
                      <div style={{textAlign:"center",minWidth:"48px",flexShrink:0}}>
                        {hs?<div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",color:"#fff",letterSpacing:"2px"}}>{s.s1}–{s.s2}</div>:<div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".78rem",color:"rgba(255,255,255,.25)",letterSpacing:"2px"}}>VS</div>}
                      </div>
                      <div style={{flex:1,display:"flex",alignItems:"center",gap:"7px",minWidth:"90px"}}>
                        <div>
                          {o2&&<div style={{fontSize:".58rem",color:GOLD,marginBottom:"1px"}}>{o2}</div>}
                          <div style={{fontSize:".8rem",color:"rgba(255,255,255,.82)"}}>{m.t2f} {m.t2}</div>
                        </div>
                        {o2&&teamPhotos[o2]&&<div style={{width:"24px",height:"24px",borderRadius:"50%",overflow:"hidden",flexShrink:0}}><img src={teamPhotos[o2]} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>}
                      </div>
                    </div>
                  );})}
                </div>
              )}

              <div onClick={watchReplay} style={{display:"flex",alignItems:"center",gap:"12px",background:"rgba(255,255,255,.028)",border:"1px solid rgba(255,255,255,.07)",borderRadius:"12px",padding:"11px 14px",marginBottom:"18px",cursor:"pointer"}}>
                <div style={{fontSize:"1.5rem",flexShrink:0}}>🎬</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",color:"rgba(255,255,255,.7)"}}>Rewatch the Draw</div>
                  <div style={{fontSize:".65rem",color:"rgba(255,255,255,.28)",marginTop:"1px"}}>Replay the full draw animation from the start</div>
                </div>
                <div style={{fontSize:".75rem",color:"rgba(255,255,255,.22)"}}>▶</div>
              </div>

              <div style={{marginBottom:"20px"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",color:"rgba(255,255,255,.4)",letterSpacing:"4px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
                  Leaderboard<div style={{flex:1,height:"1px",background:"rgba(255,255,255,.07)"}}/>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:"7px"}}>
                  {sweepstakeStandings.map((p,i)=>(
                    <div key={p.name} style={{display:"flex",alignItems:"center",gap:"12px",padding:"13px 14px",background:i===0?"linear-gradient(135deg,rgba(240,192,64,.1),rgba(240,192,64,.04))":"rgba(255,255,255,.025)",border:`1px solid ${i===0?"rgba(240,192,64,.26)":i===1?"rgba(176,196,222,.13)":i===2?"rgba(205,127,50,.13)":"rgba(255,255,255,.055)"}`,borderRadius:"14px"}}>
                      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.7rem",minWidth:"30px",textAlign:"center",lineHeight:1}}>{medals[i]||`${i+1}`}</div>
                      {isAdmin?(
                        <label htmlFor={`photo-${p.name.replace(/\s+/g,"_")}`} style={{cursor:"pointer",flexShrink:0,position:"relative",display:"block"}}>
                          <div style={{width:"50px",height:"50px",borderRadius:"50%",overflow:"hidden",background:"rgba(255,255,255,.06)",border:`2px solid ${i===0?"rgba(240,192,64,.5)":i===1?"rgba(176,196,222,.28)":i===2?"rgba(205,127,50,.28)":"rgba(255,255,255,.14)"}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                            {teamPhotos[p.name]?<img src={teamPhotos[p.name]} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={p.name}/>:<span style={{fontSize:"1.2rem",opacity:.35}}>📷</span>}
                          </div>
                          <input id={`photo-${p.name.replace(/\s+/g,"_")}`} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handlePhotoUpload(p.name,e.target.files[0])}/>
                        </label>
                      ):(
                        <div style={{width:"50px",height:"50px",borderRadius:"50%",overflow:"hidden",background:"rgba(255,255,255,.06)",border:`2px solid ${i===0?"rgba(240,192,64,.5)":i===1?"rgba(176,196,222,.28)":i===2?"rgba(205,127,50,.28)":"rgba(255,255,255,.14)"}`,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {teamPhotos[p.name]?<img src={teamPhotos[p.name]} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={p.name}/>:<span style={{fontSize:"1.2rem",opacity:.32}}>👤</span>}
                        </div>
                      )}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.1rem",letterSpacing:"1px",color:i===0?GOLD:i===1?"#b0c4de":i===2?"#cd7f32":"rgba(255,255,255,.88)",marginBottom:"4px"}}>{p.name}</div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:"4px"}}>
                          {p.teams.map(t=><span key={t.name} title={t.name} style={{fontSize:".85rem"}}>{t.flag}</span>)}
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.9rem",color:i===0?GOLD:i===1?"#b0c4de":i===2?"#cd7f32":"rgba(255,255,255,.4)",lineHeight:1}}>{p.totalPts}</div>
                        <div style={{fontSize:".55rem",color:"rgba(255,255,255,.28)",letterSpacing:"1px"}}>POINTS</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {wcStandings.some(t=>t.pts>0)&&(
                <div style={{marginBottom:"20px"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",color:"rgba(255,255,255,.4)",letterSpacing:"4px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
                    WC Standings<div style={{flex:1,height:"1px",background:"rgba(255,255,255,.07)"}}/>
                  </div>
                  <div style={{background:"rgba(255,255,255,.022)",border:"1px solid rgba(255,255,255,.06)",borderRadius:"12px",overflow:"hidden"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:".77rem"}}>
                      <thead><tr style={{borderBottom:"1px solid rgba(255,255,255,.06)"}}>
                        {["#","Team","Grp","P","W","D","L","Pts"].map(c=><th key={c} style={{textAlign:c==="Team"?"left":"center",padding:"7px 5px",color:"rgba(255,255,255,.3)",fontWeight:400,fontSize:".65rem",letterSpacing:"1px"}}>{c}</th>)}
                      </tr></thead>
                      <tbody>
                        {wcStandings.slice(0,20).map((t,i)=>(
                          <tr key={t.name} style={{borderTop:i>0?"1px solid rgba(255,255,255,.04)":"none",background:teamOwnerMap[t.name]?"rgba(240,192,64,.04)":"transparent"}}>
                            <td style={{padding:"5px",textAlign:"center",color:"rgba(255,255,255,.28)",fontSize:".7rem"}}>{i+1}</td>
                            <td style={{padding:"4px 5px"}}>
                              <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
                                <span style={{fontSize:".88rem"}}>{t.flag}</span>
                                <span style={{color:"rgba(255,255,255,.78)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"78px",fontSize:".72rem"}}>{t.name}</span>
                                {teamOwnerMap[t.name]&&<span style={{color:GOLD,fontSize:".58rem"}}>({teamOwnerMap[t.name]})</span>}
                              </div>
                            </td>
                            <td style={{textAlign:"center",padding:"4px 5px",color:"rgba(255,255,255,.28)",fontSize:".65rem"}}>{t.group}</td>
                            {[t.p,t.w,t.d,t.l,t.pts].map((v,j)=><td key={j} style={{textAlign:"center",padding:"4px 3px",color:j===4?GOLD:"rgba(255,255,255,.58)",fontWeight:j===4?600:400,fontSize:".72rem"}}>{v}</td>)}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {losses.length>0&&(
                <div style={{marginBottom:"20px"}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",color:"rgba(255,255,255,.4)",letterSpacing:"4px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
                    Wall of Shame<div style={{flex:1,height:"1px",background:"rgba(255,255,255,.07)"}}/>
                    <button onClick={()=>setResultsTab("losses")} style={{background:"none",border:"none",color:"rgba(255,255,255,.25)",fontSize:".65rem",cursor:"pointer",letterSpacing:"1px",fontFamily:"'Bebas Neue',sans-serif",padding:"0"}}>See All →</button>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:"7px"}}>
                    {losses.slice(-3).reverse().map((l,i)=>(
                      <div key={i} style={{background:"rgba(255,55,55,.055)",border:"1px solid rgba(255,55,55,.14)",borderRadius:"11px",padding:"10px 13px",display:"flex",alignItems:"center",gap:"10px"}}>
                        <div style={{fontSize:"1.8rem",flexShrink:0}}>{l.loserFlag||"🏴"}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",color:"rgba(255,255,255,.85)",letterSpacing:"1px"}}>{l.loser}</div>
                          <div style={{fontSize:".65rem",color:"rgba(255,255,255,.28)",marginTop:"1px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.matchDesc}</div>
                        </div>
                        {l.owner&&(
                          <div style={{display:"flex",alignItems:"center",gap:"6px",flexShrink:0}}>
                            <div style={{width:"28px",height:"28px",borderRadius:"50%",overflow:"hidden",background:"rgba(255,255,255,.06)",border:"1px solid rgba(240,192,64,.25)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                              {teamPhotos[l.owner]?<img src={teamPhotos[l.owner]} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={l.owner}/>:<span style={{fontSize:".8rem"}}>👤</span>}
                            </div>
                            <div>
                              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".78rem",color:GOLD,letterSpacing:"1px"}}>{l.owner}</div>
                              <div style={{fontSize:".55rem",color:"rgba(255,80,80,.6)"}}>ICED 🍾</div>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )
        )}

        {/* =================== GROUPS =================== */}
        {resultsTab==="groups"&&(
          <div style={{marginBottom:"22px"}}>
            {isAdmin&&<div style={{marginBottom:"10px",padding:"7px 11px",background:"rgba(240,192,64,.04)",border:"1px solid rgba(240,192,64,.1)",borderRadius:"8px",fontSize:".72rem",color:"rgba(255,255,255,.38)"}}>
              Expand any group with the Scores button to enter results. Standings update instantly.
            </div>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"11px"}}>
              {GROUPS.map(group=><GCard key={group.id} group={group} scores={scores} onScore={handleScore} isAdmin={isAdmin} ownerMap={teamOwnerMap}/>)}
            </div>
            {!isAdmin&&!Object.keys(scores).length&&<div style={{textAlign:"center",padding:"20px",color:"rgba(255,255,255,.3)",fontSize:".82rem",marginTop:"8px"}}>Tournament starts 11 June 2026. Group standings will appear once matches kick off.</div>}
            {isAdmin&&demoStage===1&&<div style={{textAlign:"center",marginTop:"14px"}}><button onClick={advanceDemo} style={{background:"linear-gradient(135deg,#f5a623,#c47d0a)",border:"none",borderRadius:"8px",padding:"9px 22px",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"2px",color:"#070c14",cursor:"pointer"}}>Stage 2: Fill Demo Results →</button></div>}
          </div>
        )}

        {/* =================== BRACKET =================== */}
        {resultsTab==="top16"&&(
          <div style={{marginBottom:"22px"}}>
            <Top16Interactive ko={koData} onSave={saveKo} isAdmin={isAdmin} ownerMap={teamOwnerMap} scores={scores} onIcing={triggerIcing}/>
            {isAdmin&&demoStage===2&&<div style={{textAlign:"center",marginTop:"20px"}}><button onClick={advanceDemo} style={{background:"linear-gradient(135deg,#f5a623,#c47d0a)",border:"none",borderRadius:"8px",padding:"9px 22px",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"2px",color:"#070c14",cursor:"pointer"}}>Stage 3: Run Knockout Bracket →</button></div>}
          </div>
        )}

        {/* =================== WALL OF SHAME =================== */}
        {resultsTab==="losses"&&(
          <div style={{marginBottom:"22px"}}>
            {losses.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,.28)"}}>
                <div style={{fontSize:"3rem",marginBottom:"10px",opacity:.45}}>🛡️</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:"3px",marginBottom:"5px",color:"rgba(255,255,255,.45)"}}>Wall of Shame</div>
                <div style={{fontSize:".85rem",marginBottom:"5px"}}>No knockouts yet</div>
                <div style={{fontSize:".75rem",opacity:.6}}>Losers will appear here once the knockout stage begins</div>
              </div>
            ):(
              <div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",color:"rgba(255,255,255,.4)",letterSpacing:"4px",marginBottom:"14px",textAlign:"center"}}>🪦 Wall of Shame 🪦</div>
                <div style={{display:"flex",flexDirection:"column",gap:"9px"}}>
                  {losses.slice().reverse().map((l,i)=>(
                    <div key={i} style={{background:"rgba(255,55,55,.055)",border:"1px solid rgba(255,55,55,.15)",borderRadius:"14px",padding:"13px 15px",display:"flex",alignItems:"center",gap:"12px"}}>
                      <div style={{fontSize:"2.1rem",flexShrink:0}}>{l.loserFlag||"🏴"}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",color:"rgba(255,255,255,.88)",letterSpacing:"1px"}}>{l.loser}</div>
                        <div style={{fontSize:".72rem",color:"rgba(255,255,255,.32)",marginTop:"2px",lineHeight:1.4}}>{l.matchDesc}</div>
                      </div>
                      {l.owner&&(
                        <div style={{display:"flex",alignItems:"center",gap:"8px",flexShrink:0}}>
                          <div style={{width:"36px",height:"36px",borderRadius:"50%",overflow:"hidden",background:"rgba(255,255,255,.06)",border:"1px solid rgba(240,192,64,.28)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            {teamPhotos[l.owner]?<img src={teamPhotos[l.owner]} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={l.owner}/>:<span style={{fontSize:"1rem"}}>👤</span>}
                          </div>
                          <div>
                            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".88rem",color:GOLD,letterSpacing:"1px"}}>{l.owner}</div>
                            <div style={{fontSize:".6rem",color:"rgba(255,80,80,.65)",letterSpacing:"1px"}}>ICED 🍾</div>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* Bottom actions */}
        <div style={{display:"flex",gap:"10px",justifyContent:"center",flexWrap:"wrap",paddingTop:"16px",borderTop:"1px solid rgba(255,255,255,.05)"}}>
          <button onClick={copyResults} style={{background:copied?"rgba(125,219,80,.1)":"rgba(255,255,255,.05)",border:`1px solid ${copied?"rgba(125,219,80,.28)":"rgba(255,255,255,.1)"}`,borderRadius:"8px",padding:"9px 22px",color:copied?"#7ddb50":"rgba(255,255,255,.4)",fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",cursor:"pointer",transition:"all .2s"}}>{copied?"✓ Copied!":"Copy Results"}</button>
          {isAdmin&&<button onClick={reset} style={{background:"rgba(255,55,55,.05)",border:"1px solid rgba(255,55,55,.16)",borderRadius:"8px",padding:"9px 22px",color:"rgba(255,100,100,.6)",fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",cursor:"pointer"}}>Reset Draw</button>}
        </div>

      </div>
    </div>
    {icingAlerts.length>0&&<IcingModalGroup alerts={icingAlerts} onDismiss={()=>setIcingAlerts([])}/>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
