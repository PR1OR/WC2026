function calcS(g,sc){const pts={};const st={};g.teams.forEach(t=>{pts[t.n]=0;st[t.n]={p:0,w:0,d:0,l:0,gf:0,ga:0}});g.matches.forEach(m=>{const k=`${m.t1}_${m.t2}`;const s=sc[k];if(s&&s.s1!==""&&s.s2!==""){const s1=+s.s1,s2=+s.s2;st[m.t1].p++;st[m.t2].p++;st[m.t1].gf+=s1;st[m.t1].ga+=s2;st[m.t2].gf+=s2;st[m.t2].ga+=s1;if(s1>s2){st[m.t1].w++;pts[m.t1]=(pts[m.t1]||0)+3;st[m.t2].l++}else if(s1<s2){st[m.t2].w++;pts[m.t2]=(pts[m.t2]||0)+3;st[m.t1].l++}else{st[m.t1].d++;st[m.t2].d++;pts[m.t1]=(pts[m.t1]||0)+1;pts[m.t2]=(pts[m.t2]||0)+1}}});return g.teams.map(t=>({...t,...st[t.n],gd:st[t.n].gf-st[t.n].ga,pts:pts[t.n]||0,name:t.n,flag:t.f})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}
function gsDone(sc){return GROUPS.every(g=>g.matches.every(m=>{const s=sc[`${m.t1}_${m.t2}`];return s&&s.s1!==""&&s.s2!=="";}))}
function getAdv(sc){const w=[],r=[];GROUPS.forEach(g=>{const s=calcS(g,sc);if(s[0]?.p>0){w.push({...s[0],pos:"W",grp:g.id});r.push({...s[1],pos:"2nd",grp:g.id})}});const th=GROUPS.map(g=>{const s=calcS(g,sc);return{...s[2],grp:g.id}}).filter(t=>t?.p>0).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8).map(t=>({...t,pos:"3rd"}));return[...w,...r,...th]}
function mkDemo(){const s={};GROUPS.forEach(g=>{const str=[.80,.58,.38,.22];g.matches.forEach(m=>{const k=`${m.t1}_${m.t2}`;const i1=g.teams.findIndex(t=>t.n===m.t1),i2=g.teams.findIndex(t=>t.n===m.t2);const a=str[i1]+Math.random()*.28,b=str[i2]+Math.random()*.28;const df=a-b;let s1,s2;if(Math.abs(df)<.08){s1=Math.floor(Math.random()*2);s2=s1}else if(df>0){s1=Math.floor(Math.random()*3)+1;s2=Math.max(0,s1-Math.floor(Math.random()*s1+1))}else{s2=Math.floor(Math.random()*3)+1;s1=Math.max(0,s2-Math.floor(Math.random()*s2+1))};s[k]={s1:String(s1),s2:String(s2)}})});return s}

function prop(ko,rnd,idx,wn,wf,wo,ln,lf,lo){
  const k=JSON.parse(JSON.stringify(ko));
  const set=(r,i,pos,n,f,o)=>{if(r==="final"||r==="third"){k[r][pos]=n;k[r][pos==="t1"?"f1":"f2"]=f;k[r][pos==="t1"?"o1":"o2"]=o}else{k[r][i][pos]=n;k[r][i][pos==="t1"?"f1":"f2"]=f;k[r][i][pos==="t1"?"o1":"o2"]=o}};
  const nx={r32:{r:"r16",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},r16:{r:"qf",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},qf:{r:"sf",i:Math.floor(idx/2),p:idx%2===0?"t1":"t2"},sf:{r:"final",i:0,p:idx===0?"t1":"t2"}};
  const nx2=nx[rnd];if(nx2)set(nx2.r,nx2.i,nx2.p,wn,wf,wo);
  if(rnd==="sf"){const lp=idx===0?"t1":"t2";set("third",0,lp,ln,lf,lo)}
  return k
}

function Cd(){const[t,setT]=useState({});useEffect(()=>{const u=()=>{const d=new Date("2026-06-11T15:00:00Z")-new Date();if(d<=0){setT({done:true});return}setT({dy:Math.floor(d/86400000),hr:Math.floor(d%86400000/3600000),mn:Math.floor(d%3600000/60000),sc:Math.floor(d%60000/1000)})};u();const id=setInterval(u,1000);return()=>clearInterval(id)},[]);if(t.done||t.dy===undefined)return null;return(<div style={{display:"flex",gap:"10px",justifyContent:"center",marginBottom:"20px",flexWrap:"wrap"}}>{[["Days",t.dy],["Hours",t.hr],["Mins",t.mn],["Secs",t.sc]].map(([l,v])=>(<div key={l} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(240,192,64,.15)",borderRadius:"10px",padding:"12px 16px",textAlign:"center",minWidth:"68px"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:G,lineHeight:1}}>{String(v).padStart(2,"0")}</div><div style={{fontSize:"10px",letterSpacing:"2px",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginTop:"4px"}}>{l}</div></div>))}</div>)}

function Slot({name,flag,owner,win,score,side}){const rt=side==="right";return(<div style={{display:"flex",alignItems:"center",gap:"4px",padding:"3px 6px",minHeight:"28px",background:win?"rgba(240,192,64,.12)":"transparent",borderBottom:"1px solid rgba(255,255,255,.06)",flexDirection:rt?"row-reverse":"row"}}>{name?<><span style={{fontSize:".85rem",flexShrink:0}}>{flag||FL[name]||""}</span><div style={{flex:1,minWidth:0,textAlign:rt?"right":"left"}}><div style={{fontSize:".7rem",color:win?G:"rgba(255,255,255,.85)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:win?600:400}}>{name}</div>{owner&&<div style={{fontSize:".6rem",color:G,opacity:.75}}>{owner}</div>}</div>{score!==""&&<div style={{fontSize:".9rem",fontFamily:"'Bebas Neue',sans-serif",color:win?G:"rgba(255,255,255,.6)",minWidth:"14px",textAlign:"center",flexShrink:0}}>{score}</div>}</>:<div style={{fontSize:".68rem",color:"rgba(255,255,255,.2)",flex:1,textAlign:rt?"right":"left"}}>TBD</div>}</div>)}

function BM({m,side,editable,onClick}){const has=m.t1&&m.t2;const hs=m.s1!==""&&m.s2!=="";return(<div onClick={editable&&has?onClick:undefined} style={{width:"150px",border:`1px solid rgba(255,255,255,${hs?".22":".1"})`,borderRadius:"6px",overflow:"hidden",background:"#0a1628",cursor:editable&&has?"pointer":"default",flexShrink:0}}><Slot name={m.t1} flag={m.f1} owner={m.o1} win={hs&&m.w===m.t1} score={hs?m.s1:""} side={side}/><Slot name={m.t2} flag={m.f2} owner={m.o2} win={hs&&m.w===m.t2} score={hs?m.s2:""} side={side}/></div>)}

function SweepTab({drawData,scores}){if(!drawData)return(<div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,.3)"}}><div style={{fontSize:"2rem",marginBottom:"10px",opacity:.4}}>🎲</div><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.2rem",letterSpacing:"3px",marginBottom:"6px"}}>No Draw Yet</div><div style={{fontSize:".9rem"}}>Run the draw first</div></div>);const tp={};GROUPS.forEach(g=>{calcS(g,scores).forEach(t=>{tp[t.name]=t.pts})});const st=drawData.names.map(n=>({name:n,teams:drawData.assignments[n]||[],pts:(drawData.assignments[n]||[]).reduce((s,t)=>s+(tp[t.name]||0),0)})).sort((a,b)=>b.pts-a.pts);const md=["🥇","🥈","🥉"];return(<div style={{maxWidth:"660px",margin:"0 auto",padding:"20px 0"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",color:G,letterSpacing:"3px",marginBottom:"4px",textAlign:"center"}}>Sweepstake Leaderboard</div><div style={{color:"rgba(255,255,255,.4)",fontSize:".8rem",textAlign:"center",marginBottom:"18px"}}>Points = total group stage points for all your teams</div>{st.map((p,i)=>(<div key={p.name} style={{background:i===0?"rgba(240,192,64,.06)":"rgba(255,255,255,.025)",border:`1px solid ${i===0?"rgba(240,192,64,.25)":"rgba(255,255,255,.07)"}`,borderRadius:"12px",padding:"13px 16px",marginBottom:"9px",display:"flex",alignItems:"flex-start",gap:"13px"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",minWidth:"34px",lineHeight:1,paddingTop:"2px"}}>{md[i]||String(i+1).padStart(2,"0")}</div><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"7px"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",letterSpacing:"1px"}}>{p.name}</div><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.6rem",color:i===0?G:i===1?"#b0c4de":i===2?"#cd7f32":"rgba(255,255,255,.5)"}}>{p.pts}<span style={{fontSize:".65rem",letterSpacing:"1px",marginLeft:"2px",opacity:.7}}>pts</span></div></div><div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>{p.teams.map(t=><div key={t.name} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"6px",padding:"3px 8px",display:"flex",alignItems:"center",gap:"4px",fontSize:".78rem"}}><span style={{fontSize:".9rem"}}>{t.flag}</span><span style={{color:"rgba(255,255,255,.75)"}}>{t.name}</span><span style={{color:G,fontWeight:600}}>{tp[t.name]||0}pt</span></div>)}</div></div></div>))}</div>)}

function MailerTab({drawData,scores}){const[loading,setLoading]=useState(false);const[text,setText]=useState("");const[copied,setCopied]=useState(false);const tp={};GROUPS.forEach(g=>{calcS(g,scores).forEach(t=>{tp[t.name]=t.pts})});const gen=async()=>{if(!drawData){setText("Run the draw first.");return}setLoading(true);setText("");const sl=(drawData.names.map(n=>({name:n,teams:drawData.assignments[n]||[],pts:(drawData.assignments[n]||[]).reduce((s,t)=>s+(tp[t.name]||0),0)})).sort((a,b)=>b.pts-a.pts)).map((p,i)=>`${i+1}. ${p.name}: ${p.teams.map(t=>`${t.flag} ${t.name}`).join(", ")} - ${p.pts} pts`).join("\n");const prompt=`You are writing the weekly World Cup 2026 sweepstake update for a UK office. Be GENUINELY funny. British banter. Think Match of the Day meets The Office. Search for this week's actual World Cup 2026 results first.\n\nCurrent sweepstake standings:\n${sl}\n\nWrite a Teams message with: a punchy headline, leaderboard with one-liner per person based on their teams' form, commentary on the most notable result this week with actual score, upcoming fixtures to watch, football pun sign-off. Under 280 words. No em dashes. If someone has Scotland, mention it.`;try{const r=await fetch("/api/mailer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});const d=await r.json();setText(d.text||"No response. Check Netlify function setup.")}catch{setText("Could not reach the mailer function.\n\nSee SETUP.md - you need ANTHROPIC_API_KEY in Netlify environment variables.")}finally{setLoading(false)}};return(<div style={{maxWidth:"660px",margin:"0 auto",padding:"20px 0"}}><div style={{textAlign:"center",marginBottom:"22px"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",color:G,letterSpacing:"3px",marginBottom:"5px"}}>Weekly Mailer Generator</div><div style={{color:"rgba(255,255,255,.45)",fontSize:".9rem"}}>AI writes a funny weekly update based on real results and your sweepstake standings</div></div>{!drawData&&<div style={{background:"rgba(255,165,0,.07)",border:"1px solid rgba(255,165,0,.2)",borderRadius:"10px",padding:"13px",marginBottom:"18px",textAlign:"center",color:"rgba(255,165,0,.8)",fontSize:".85rem"}}>No draw data found. Run the draw first.</div>}<button onClick={gen} disabled={loading||!drawData} style={{width:"100%",background:loading||!drawData?"rgba(240,192,64,.1)":`linear-gradient(135deg,${G},#c89a10)`,border:"none",borderRadius:"10px",padding:"14px",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:"3px",color:loading||!drawData?"rgba(255,255,255,.3)":"#070c14",cursor:loading||!drawData?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"12px"}}>{loading?<><div style={{width:"18px",height:"18px",border:"2px solid rgba(240,192,64,.2)",borderTopColor:G,borderRadius:"50%",animation:"spin .8s linear infinite"}}/>Searching and writing...</>:"Generate This Week's Update"}</button>{text&&<div style={{marginTop:"18px"}}><textarea value={text} onChange={e=>setText(e.target.value)} rows={14} style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1px solid rgba(240,192,64,.2)",borderRadius:"10px",padding:"16px",color:"rgba(255,255,255,.88)",fontSize:".9rem",lineHeight:1.7,display:"block"}}/><div style={{display:"flex",gap:"8px",marginTop:"10px",justifyContent:"flex-end"}}><button onClick={gen} disabled={loading} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"8px",padding:"8px 18px",color:"rgba(255,255,255,.55)",fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",cursor:"pointer"}}>Regenerate</button><button onClick={()=>{navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500)})}} style={{background:copied?"rgba(125,219,80,.14)":"rgba(240,192,64,.09)",border:`1px solid ${copied?"rgba(125,219,80,.4)":"rgba(240,192,64,.28)"}`,borderRadius:"8px",padding:"8px 20px",color:copied?"#7ddb50":G,fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",cursor:"pointer",transition:"all .2s"}}>{copied?"Copied!":"Copy for Teams"}</button></div></div>}</div>)}

function App(){
  const[scores,setScores]=useState(()=>{try{return JSON.parse(localStorage.getItem("wc26_scores")||"{}")}catch{return{}}});
  const[isAdmin,setIsAdmin]=useState(false);const[showLogin,setShowLogin]=useState(false);const[adminInput,setAdminInput]=useState("");
  const[activeGroup,setActiveGroup]=useState(null);const[activeTab,setActiveTab]=useState("groups");
  const[drawData,setDrawData]=useState(()=>{try{const d=localStorage.getItem("wc26_draw_data");return d?JSON.parse(d):null}catch{return null}});
  const[msg,setMsg]=useState("");
  useEffect(()=>{localStorage.setItem("wc26_scores",JSON.stringify(scores))},[scores]);
  useEffect(()=>{const chk=()=>{try{const d=localStorage.getItem("wc26_draw_data");if(d)setDrawData(JSON.parse(d))}catch{}};chk();const id=setInterval(chk,3000);return()=>clearInterval(id)},[]);
  const doLogin=()=>{if(adminInput===PW){setIsAdmin(true);setShowLogin(false);setAdminInput("")}else{alert("Wrong password")}};
  const handleScore=useCallback((k,v)=>setScores(p=>({...p,[k]:v})),[]);
  const loadDemo=()=>{const d=mkDemo();localStorage.setItem("wc26_scores",JSON.stringify(d));setScores(d);setMsg("Demo scores loaded. Check Sweepstake and Knockout tabs to test.");setTimeout(()=>setMsg(""),5000)};
  const clearAll=()=>{localStorage.setItem("wc26_scores","{}");setScores({});localStorage.removeItem("wc26_ko");setMsg("Cleared.");setTimeout(()=>setMsg(""),2500)};
  const ownerMap=useMemo(()=>{if(!drawData)return{};const m={};Object.entries(drawData.assignments||{}).forEach(([p,ts])=>{(ts||[]).forEach(t=>{m[t.name]=p})});return m},[drawData]);
  const TABS=[{id:"groups",l:"Groups"},{id:"sweep",l:"Sweepstake"},{id:"knockout",l:"Knockout"},{id:"mailer",l:"Mailer"}];
  const showGroups=activeGroup?GROUPS.filter(g=>g.id===activeGroup):GROUPS;
  return(<div style={{minHeight:"100vh",background:BG,color:"#fff",fontFamily:"'Barlow',sans-serif",padding:"24px 20px"}}><div style={{maxWidth:"1100px",margin:"0 auto"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",flexWrap:"wrap",gap:"12px"}}>
      <div><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(1.8rem,5vw,3rem)",color:G,letterSpacing:"4px",lineHeight:1}}>World Cup 2026</div><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(.8rem,2.5vw,1.3rem)",letterSpacing:"6px",opacity:.65,marginTop:"2px"}}>Fixtures and Sweepstake</div></div>
      <button onClick={()=>{if(isAdmin){setIsAdmin(false)}else{setShowLogin(s=>!s)}}} style={{background:isAdmin?"rgba(125,219,80,.12)":"rgba(255,255,255,.05)",border:`1px solid ${isAdmin?"rgba(125,219,80,.3)":"rgba(255,255,255,.15)"}`,borderRadius:"8px",padding:"8px 16px",color:isAdmin?"#7ddb50":"rgba(255,255,255,.5)",fontSize:".8rem",cursor:"pointer",letterSpacing:"1px"}}>{isAdmin?"🔓 Organiser (click to exit)":"🔒 Organiser Login"}</button>
    </div>
    {showLogin&&!isAdmin&&<div style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(240,192,64,.2)",borderRadius:"10px",padding:"12px 16px",marginBottom:"14px",display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
      <span style={{fontSize:".85rem",color:"rgba(255,255,255,.5)"}}>Organiser password:</span>
      <input value={adminInput} onChange={e=>setAdminInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} type="password" placeholder="Enter password..." style={{background:"rgba(255,255,255,.09)",border:"1px solid rgba(240,192,64,.25)",borderRadius:"6px",padding:"8px 12px",color:"#fff",fontSize:"1rem",fontFamily:"inherit",flex:1,minWidth:"160px"}}/>
      <button onClick={doLogin} style={{background:G,border:"none",borderRadius:"6px",padding:"8px 18px",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1rem",letterSpacing:"2px",color:"#070c14",cursor:"pointer"}}>Unlock</button>
      <span style={{fontSize:".75rem",color:"rgba(255,255,255,.3)"}}>Default: wc2026admin</span>
    </div>}
    <div style={{background:"rgba(240,192,64,.04)",border:"1px solid rgba(240,192,64,.15)",borderRadius:"10px",padding:"12px 16px",marginBottom:"14px",display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:"6px",marginRight:"4px"}}>
        <span style={{fontSize:"1rem"}}>🧪</span>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".85rem",color:G,letterSpacing:"2px"}}>Test Tools</span>
      </div>
      {isAdmin?(
        <>
          <button onClick={loadDemo} style={{background:"rgba(240,192,64,.12)",border:"1px solid rgba(240,192,64,.3)",borderRadius:"7px",padding:"7px 16px",color:G,fontFamily:"'Bebas Neue',sans-serif",fontSize:".85rem",letterSpacing:"2px",cursor:"pointer"}}>Load Demo Scores</button>
          <button onClick={clearAll} style={{background:"rgba(255,80,80,.07)",border:"1px solid rgba(255,80,80,.2)",borderRadius:"7px",padding:"7px 16px",color:"rgba(255,120,120,.6)",fontFamily:"'Bebas Neue',sans-serif",fontSize:".85rem",letterSpacing:"2px",cursor:"pointer"}}>Clear All Scores</button>
          <span style={{fontSize:".78rem",color:"rgba(255,255,255,.3)"}}>Fills all 72 group matches with realistic fake scores so you can test the full app now</span>
          {msg&&<span style={{fontSize:".8rem",color:"#7ddb50",fontWeight:600}}>{msg}</span>}
        </>
      ):(
        <div style={{display:"flex",alignItems:"center",gap:"8px",flex:1}}>
          <span style={{fontSize:".8rem",color:"rgba(255,255,255,.4)"}}>Test the full app before the tournament starts — requires organiser login</span>
          <button onClick={()=>setShowLogin(true)} style={{background:"rgba(240,192,64,.08)",border:"1px solid rgba(240,192,64,.2)",borderRadius:"6px",padding:"5px 14px",color:"rgba(240,192,64,.7)",fontFamily:"'Bebas Neue',sans-serif",fontSize:".8rem",letterSpacing:"2px",cursor:"pointer"}}>Log In</button>
        </div>
      )}
    </div>
    <Cd/>
    <div style={{display:"flex",gap:"4px",marginBottom:"18px",background:"rgba(255,255,255,.04)",borderRadius:"10px",padding:"4px"}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setActiveTab(t.id)} style={{flex:1,background:activeTab===t.id?"rgba(240,192,64,.15)":"transparent",border:activeTab===t.id?"1px solid rgba(240,192,64,.3)":"1px solid transparent",borderRadius:"7px",padding:"9px 4px",fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",letterSpacing:"2px",color:activeTab===t.id?G:"rgba(255,255,255,.45)",cursor:"pointer",transition:"all .2s"}}>{t.l}</button>)}
    </div>
    {activeTab==="groups"&&<>
      <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"14px"}}>
        <button onClick={()=>setActiveGroup(null)} style={{background:activeGroup===null?"rgba(240,192,64,.14)":"rgba(255,255,255,.04)",border:`1px solid ${activeGroup===null?"rgba(240,192,64,.35)":"rgba(255,255,255,.12)"}`,borderRadius:"6px",padding:"5px 12px",color:activeGroup===null?G:"rgba(255,255,255,.5)",fontSize:".8rem",cursor:"pointer"}}>All</button>
        {GROUPS.map(g=><button key={g.id} onClick={()=>setActiveGroup(g.id)} style={{background:activeGroup===g.id?"rgba(240,192,64,.14)":"rgba(255,255,255,.04)",border:`1px solid ${activeGroup===g.id?"rgba(240,192,64,.35)":"rgba(255,255,255,.12)"}`,borderRadius:"6px",padding:"5px 12px",color:activeGroup===g.id?G:"rgba(255,255,255,.5)",fontSize:".8rem",cursor:"pointer"}}>Grp {g.id}</button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:"14px"}}>
        {showGroups.map(g=><GCard key={g.id} group={g} sc={scores} onSc={handleScore} isAdmin={isAdmin} ownerMap={ownerMap}/>)}
      </div>
      <div style={{marginTop:"16px",padding:"10px",background:"rgba(240,192,64,.04)",border:"1px solid rgba(240,192,64,.1)",borderRadius:"8px",fontSize:"12px",color:"rgba(255,255,255,.3)",textAlign:"center"}}>Gold bar = advancing to Round of 32. Names in gold = sweepstake holder.</div>
    </>}
    {activeTab==="sweep"&&<SweepTab drawData={drawData} scores={scores}/>}
    {activeTab==="knockout"&&<KOTab scores={scores} ownerMap={ownerMap} isAdmin={isAdmin}/>}
    {activeTab==="mailer"&&(isAdmin?<MailerTab drawData={drawData} scores={scores}/>:<div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,.35)"}}>🔒 Log in as organiser to generate the weekly mailer</div>)}
  </div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
